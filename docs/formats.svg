<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" role="img" aria-label="deepseek-vision 支持格式一览">
  <text x="540" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">支持格式一览</text>
  <text x="540" y="76" text-anchor="middle" font-size="15" fill="#475569" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">analyze 用于图片、音频、视频理解；asr 仅听写 wav / mp3</text>

  <g>
    <rect x="60" y="110" width="300" height="52" rx="12" fill="#334155"/>
    <rect x="380" y="110" width="300" height="52" rx="12" fill="#334155"/>
    <rect x="700" y="110" width="320" height="52" rx="12" fill="#334155"/>
    <text x="210" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">媒体类型</text>
    <text x="530" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">支持格式</text>
    <text x="860" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">用途与限制</text>
  </g>

  <g>
    <rect x="60" y="182" width="300" height="66" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="96" cy="215" r="7" fill="#0284c7"/>
    <text x="116" y="221" font-size="19" font-weight="700" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">图片</text>
    <rect x="380" y="182" width="300" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="530" y="221" text-anchor="middle" font-size="18" fill="#0f172a" font-family="Menlo, Consolas, monospace">png jpg gif webp bmp</text>
    <rect x="700" y="182" width="320" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="860" y="221" text-anchor="middle" font-size="16" fill="#334155" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">理解、描述与问答</text>
  </g>

  <g>
    <rect x="60" y="268" width="300" height="66" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <circle cx="96" cy="301" r="7" fill="#16a34a"/>
    <text x="116" y="307" font-size="19" font-weight="700" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">音频</text>
    <rect x="380" y="268" width="300" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="530" y="301" text-anchor="middle" font-size="18" fill="#0f172a" font-family="Menlo, Consolas, monospace">mp3 wav flac m4a ogg</text>
    <rect x="700" y="268" width="320" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="860" y="301" text-anchor="middle" font-size="16" fill="#334155" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">理解，或交给 ASR 听写</text>
  </g>

  <g>
    <rect x="60" y="354" width="300" height="66" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="96" cy="387" r="7" fill="#d97706"/>
    <text x="116" y="393" font-size="19" font-weight="700" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">视频</text>
    <rect x="380" y="354" width="300" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="530" y="387" text-anchor="middle" font-size="18" fill="#0f172a" font-family="Menlo, Consolas, monospace">mp4 mov avi wmv</text>
    <rect x="700" y="354" width="320" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="860" y="387" text-anchor="middle" font-size="16" fill="#334155" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">可调 fps 与分辨率</text>
  </g>

  <g>
    <rect x="60" y="440" width="300" height="40" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="210" y="466" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">ASR 听写</text>
    <rect x="380" y="440" width="300" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="530" y="466" text-anchor="middle" font-size="17" fill="#0f172a" font-family="Menlo, Consolas, monospace">wav mp3</text>
    <rect x="700" y="440" width="320" height="40" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="860" y="466" text-anchor="middle" font-size="16" fill="#334155" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">仅支持这两个格式</text>
  </g>
</svg>
