<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="100%" role="img" aria-label="deepseek-vision 处理流程示意图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="640" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">deepseek-vision 处理流程</text>
  <text x="640" y="76" text-anchor="middle" font-size="15" fill="#475569" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">文本模型遇到非文本内容时，自动调用本地脚本，再基于 MiMo 结果回答</text>

  <g>
    <rect x="40" y="108" width="260" height="196" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="108" width="260" height="42" rx="14" fill="#0284c7"/>
    <rect x="40" y="136" width="260" height="14" fill="#0284c7"/>
    <text x="170" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">STEP 1 · 输入媒体</text>
    <text x="170" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0c4a6e" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">图片 / 音频 / 视频</text>
    <text x="170" y="224" text-anchor="middle" font-size="14" fill="#075985" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">本地文件或公网 URL</text>
    <text x="170" y="256" text-anchor="middle" font-size="13" fill="#075985" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">支持常见图片、音频、视频格式</text>
    <text x="170" y="284" text-anchor="middle" font-size="13" fill="#075985" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">单文件约 50MB 上限</text>
  </g>

  <line x1="308" y1="206" x2="348" y2="206" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="355" y="108" width="260" height="196" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <rect x="355" y="108" width="260" height="42" rx="14" fill="#0f766e"/>
    <rect x="355" y="136" width="260" height="14" fill="#0f766e"/>
    <text x="485" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">STEP 2 · 本地脚本</text>
    <text x="485" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#134e4a" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">mimo.py</text>
    <text x="485" y="224" text-anchor="middle" font-size="14" fill="#115e59" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">格式校验与 Base64 编码</text>
    <text x="485" y="256" text-anchor="middle" font-size="14" fill="#115e59" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">429 / 5xx 自动重试</text>
    <text x="485" y="288" text-anchor="middle" font-size="14" fill="#115e59" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">--dry-run 可先检查请求体</text>
  </g>

  <line x1="623" y1="206" x2="663" y2="206" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="670" y="108" width="260" height="196" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <rect x="670" y="108" width="260" height="42" rx="14" fill="#b45309"/>
    <rect x="670" y="136" width="260" height="14" fill="#b45309"/>
    <text x="800" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">STEP 3 · 小米 MiMo API</text>
    <text x="800" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#78350f" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">MiMo V2.5</text>
    <text x="800" y="224" text-anchor="middle" font-size="14" fill="#92400e" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">mimo-v2.5：理解媒体</text>
    <text x="800" y="256" text-anchor="middle" font-size="14" fill="#92400e" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">mimo-v2.5-asr：听写</text>
    <text x="800" y="288" text-anchor="middle" font-size="14" fill="#92400e" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">HTTPS 传输，key 在请求头中</text>
  </g>

  <line x1="938" y1="206" x2="978" y2="206" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="985" y="108" width="260" height="196" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="985" y="108" width="260" height="42" rx="14" fill="#4f46e5"/>
    <rect x="985" y="136" width="260" height="14" fill="#4f46e5"/>
    <text x="1115" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">STEP 4 · 结构化结果</text>
    <text x="1115" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#312e81" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">JSON 输出</text>
    <text x="1115" y="224" text-anchor="middle" font-size="14" fill="#3730a3" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">content 作为回答依据</text>
    <text x="1115" y="256" text-anchor="middle" font-size="14" fill="#3730a3" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">返回 tokens 或费用估算</text>
    <text x="1115" y="288" text-anchor="middle" font-size="14" fill="#3730a3" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">错误信息自动脱敏</text>
  </g>

  <g>
    <rect x="40" y="340" width="1200" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 6"/>
    <g transform="translate(80, 362)">
      <rect x="0" y="14" width="30" height="24" rx="5" fill="#64748b"/>
      <path d="M 4 14 v -7 a 11 11 0 0 1 22 0 v 7" fill="none" stroke="#64748b" stroke-width="4"/>
    </g>
    <text x="128" y="378" font-size="17" font-weight="700" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">密钥安全</text>
    <text x="128" y="404" font-size="14" fill="#334155" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">macOS Keychain / Windows DPAPI / Linux 受限文件（0600）</text>
    <text x="128" y="426" font-size="14" fill="#334155" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">key 不入库、不回显；status 与错误输出均脱敏</text>
  </g>
</svg>
